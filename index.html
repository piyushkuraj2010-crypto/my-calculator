 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माय फर्स्ट वेबसाइट - गेम और कैलकुलेटर</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 10px;
        }
        .card {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        /* गेम स्टाइल */
        #guessInput {
            width: 80px;
            height: 40px;
            font-size: 20px;
            text-align: center;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }
        .btn {
            background-color: #30d158;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        /* कैलकुलेटर स्टाइल */
        #display {
            width: 100%;
            height: 55px;
            background-color: #222;
            border: none;
            color: #fff;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            padding: 15px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #333;
            color: white;
        }
        .calc-btn.operator { background-color: #ff9f0a; }
        .calc-btn.clear { background-color: #a5a5a5; color: black; }
        .calc-btn.equal { background-color: #30d158; grid-column: span 2; }
    </style>
</head>
<body>

<div class="container">
    <!-- 🎲 नंबर पहचानो गेम -->
    <div class="card">
        <h2 style="color: #ff9f0a; margin-top: 0;">🎲 नंबर पहचानो गेम</h2>
        <p>1 से 10 के बीच का नंबर सोचो और लिखो:</p>
        <input type="number" id="guessInput" min="1" max="10" placeholder="?">
        <button class="btn" onclick="checkGuess()">चेक करो!</button>
        <p id="gameResult" style="font-weight: bold; margin-top: 15px;"></p>
    </div>

    <!-- 🧮 नया डिजिटल कैलकुलेटर -->
    <div class="card">
        <h2 style="color: #00bcd4; margin-top: 0;">🧮 डिजिटल कैलकुलेटर</h2>
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="calc-btn clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="calc-btn operator">/</button>
            <button onclick="appendValue('*')" class="calc-btn operator">×</button>
            <button onclick="appendValue('-')" class="calc-btn operator">−</button>
            
            <button onclick="appendValue('7')" class="calc-btn">7</button>
            <button onclick="appendValue('8')" class="calc-btn">8</button>
            <button onclick="appendValue('9')" class="calc-btn">9</button>
            <button onclick="appendValue('+')" class="calc-btn operator">+</button>
            
            <button onclick="appendValue('4')" class="calc-btn">4</button>
            <button onclick="appendValue('5')" class="calc-btn">5</button>
            <button onclick="appendValue('6')" class="calc-btn">6</button>
            
            <button onclick="appendValue('1')" class="calc-btn">1</button>
            <button onclick="appendValue('2')" class="calc-btn">2</button>
            <button onclick="appendValue('3')" class="calc-btn">3</button>
            
            <button onclick="appendValue('0')" class="calc-btn">0</button>
            <button onclick="appendValue('.')" class="calc-btn">.</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>
        </div>
    </div>
</div>

<script>
    // गेम का लॉजिक
    let targetNumber = Math.floor(Math.random() * 10) + 1;
    function checkGuess() {
        const input = document.getElementById('guessInput').value;
        const result = document.getElementById('gameResult');
        if(!input) { result.textContent = "कृपया एक नंबर डालें!"; return; }
        
        if (parseInt(input) === targetNumber) {
            result.textContent = "🎉 सही जवाब! आपने जीत लिया!";
            result.style.color = "#30d158";
            targetNumber = Math.floor(Math.random() * 10) + 1; // रीसेट गेम
        } else {
            result.textContent = "❌ गलत जवाब! दोबारा कोशिश करो।";
            result.style.color = "#ff3b30";
        }
    }

    // कैलकुलेटर का लॉजिक
    const display = document.getElementById('display');
    function appendValue(val) {
        if (display.value === '0' && val !== '.') { display.value = val; } 
        else { display.value += val; }
    }
    function clearDisplay() { display.value = ''; }
    function calculate() {
        try { display.value = eval(display.value); } 
        catch (error) { display.value = 'Error'; }
    }
</script>

</body>
</html
