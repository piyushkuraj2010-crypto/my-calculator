 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मल्टी-गेम ज़ोन</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px; }
        .game-card { background: #1e293b; border-radius: 15px; padding: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #f87171; margin-bottom: 5px; }
        .status { margin-bottom: 15px; font-size: 18px; color: #cbd5e1; }
        
        /* Tic Tac Toe Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
        .cell { width: 80px; height: 80px; background: #334155; border: none; border-radius: 10px; font-size: 32px; font-weight: bold; color: white; cursor: pointer; }
        .cell:hover { background: #475569; }
        
        /* Buttons */
        .btn-yellow { background: #f59e0b; color: #000; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-green { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        /* Number Game Input */
        .num-input { width: 60px; height: 50px; background: #334155; border: none; border-radius: 8px; font-size: 20px; color: white; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>

    <!-- 1. टिक-टैक-टो गेम -->
    <div class="game-card">
        <h2>❌⭕ टिक-टैक-टो गेम</h2>
        <div class="status" id="tic-status">बारी: प्लेयर X की</div>
        <div class="grid">
            <button class="cell" onclick="makeMove(this, 0)"></button>
            <button class="cell" onclick="makeMove(this, 1)"></button>
            <button class="cell" onclick="makeMove(this, 2)"></button>
            <button class="cell" onclick="makeMove(this, 3)"></button>
            <button class="cell" onclick="makeMove(this, 4)"></button>
            <button class="cell" onclick="makeMove(this, 5)"></button>
            <button class="cell" onclick="makeMove(this, 6)"></button>
            <button class="cell" onclick="makeMove(this, 7)"></button>
            <button class="cell" onclick="makeMove(this, 8)"></button>
        </div>
        <button class="btn-yellow" onclick="resetTicTacToe()">गेम रीसेट करें</button>
    </div>

    <!-- 2. नंबर पहचानो गेम -->
    <div class="game-card">
        <h2>🎲 नंबर पहचानो गेम</h2>
        <div class="status" id="guess-status">1 से 10 के बीच का नंबर सोचो:</div>
        <input type="number" id="user-guess" class="num-input" placeholder="?">
        <button class="btn-green" onclick="checkGuess()">चेक करो!</button>
    </div>

    <script>
        /* === टिक-टैक-टो लॉजिक === */
        let currentPlayer = 'X';
        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        const winPatterns = [, [3, 4, 5], [6, 7, 8], // Rows, [1, 4, 7], [2, 5, 8], // Columns, [2, 4, 6]             // Diagonals
        ];

        function makeMove(button, index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            button.innerText = currentPlayer;
            button.style.color = currentPlayer === 'X' ? '#f87171' : '#38bdf8';

            checkWinner();
        }

        function checkWinner() {
            let roundWon = false;
            for (let pattern of winPatterns) {
                let a = board[pattern[0]];
                let b = board[pattern[1]];
                let c = board[pattern[2]];
                if (a === "" || b === "" || c === "") continue;
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById('tic-status').innerText = `🎉 प्लेयर ${currentPlayer} जीत गया!`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById('tic-status').innerText = "🤝 गेम ड्रा हो गया!";
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('tic-status').innerText = `बारी: प्लेयर ${currentPlayer} की`;
        }

        function resetTicTacToe() {
            currentPlayer = 'X';
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            document.getElementById('tic-status').innerText = "बारी: प्लेयर X की";
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = "");
        }

        /* === नंबर पहचानो लॉजिक === */
        let targetNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            let userGuess = parseInt(document.getElementById('user-guess').value);
            let statusText = document.getElementById('guess-status');

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 10) {
                statusText.innerText = "❌ कृपया 1 से 10 के बीच नंबर डालें!";
                return;
            }

            if (userGuess === targetNumber) {
                statusText.innerText = `🎉 सही जवाब! नंबर ${targetNumber} ही था।`;
                targetNumber = Math.floor(Math.random() * 10) + 1; // Reset game
            } else if (userGuess < targetNumber) {
                statusText.innerText = "📉 थोड़ा बड़ा नंबर सोचो!";
            } else {
                statusText.innerText = "📈 थोड़ा छोटा नंबर सोचो!";
            }
        }
    </script>
</body>
</html>
